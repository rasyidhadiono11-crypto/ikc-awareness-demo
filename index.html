
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive - Video Preview</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: #f8fafd;
      color: #202124;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 760px;
      margin: 35px auto;
      padding: 24px;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 12px;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .file-icon {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8f0fe;
      color: #1967d2;
      border-radius: 8px;
      font-size: 22px;
    }

    .file-name {
      font-size: 16px;
      font-weight: 600;
    }

    .file-type {
      margin-top: 5px;
      color: #5f6368;
      font-size: 13px;
    }

    .video-area {
      overflow: hidden;
      margin-bottom: 18px;
      background: #202124;
      border-radius: 9px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 430px;
      background: #000;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button, .download {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 18px;
      border: 0;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }

    button {
      background: #1a73e8;
      color: white;
    }

    button:hover {
      background: #1765cc;
    }

    .download {
      color: #1967d2;
      background: #fff;
      border: 1px solid #dadce0;
    }

    .download:hover {
      background: #f1f3f4;
    }

    .footer {
      margin-top: 25px;
      color: #80868b;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="file-info">
      <div class="file-icon">▶</div>

      <div>
        <div class="file-name">IKC_Day1.mp4</div>
        <div class="file-type">Video MP4</div>
      </div>
    </div>

    <div class="video-area">
      <video id="videoPlayer" preload="metadata" controls>
        <source src="IKC_Day1.mp4" type="video/mp4">
        Browser Anda tidak mendukung pemutaran video.
      </video>
    </div>

    <div class="actions">

      <button id="playButton" type="button">
        ▶ Play
      </button>

      <a
        id="downloadButton"
        class="download"
        href="IKC_Day1.mp4"
        download="IKC_Day1.mp4"
      >
        ↓ Download
      </a>

    </div>

    <div class="footer">
      Video Preview
    </div>

  </main>

  <script>
    const CONFIG = {
      apiUrl: "https://script.google.com/macros/s/AKfycbwM_-qIyRyQGBVJnFuFSkktIu_BNdUEBqRiLcWIc8mKzOab6AWQ6Vki0kUIBqBRc_l-lA/exec"
    };

    const video = document.getElementById("videoPlayer");
    const playButton = document.getElementById("playButton");
    const downloadButton = document.getElementById("downloadButton");

    // Membuat ID sesi anonim
    function getSessionId() {
      let id = sessionStorage.getItem("ikc_session_id");

      if (!id) {
        id = crypto.randomUUID();
        sessionStorage.setItem("ikc_session_id", id);
      }

      return id;
    }

    // Identifikasi perangkat dan browser
    function getDeviceInfo() {
      const ua = navigator.userAgent;

      const device = /Mobi|Android|iPhone|iPad/i.test(ua)
        ? "Mobile"
        : "Desktop";

      let os = "Unknown";

      if (/Windows/i.test(ua)) os = "Windows";
      else if (/Android/i.test(ua)) os = "Android";
      else if (/iPhone|iPad/i.test(ua)) os = "iOS";
      else if (/Mac OS/i.test(ua)) os = "macOS";
      else if (/Linux/i.test(ua)) os = "Linux";

      let browser = "Unknown";

      if (/Edg/i.test(ua)) browser = "Edge";
      else if (/Chrome/i.test(ua)) browser = "Chrome";
      else if (/Firefox/i.test(ua)) browser = "Firefox";
      else if (/Safari/i.test(ua)) browser = "Safari";

      return { device, os, browser };
    }

    // Mengirim aktivitas ke Google Sheets
    function sendEvent(activity, extra = {}) {
      const info = getDeviceInfo();

      const payload = {
        session_id: getSessionId(),
        activity: activity,
        device: info.device,
        os: info.os,
        browser: info.browser,
        ...extra
      };

      fetch(CONFIG.apiUrl, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload),
        keepalive: true
      }).catch(error => {
        console.error("Logging error:", error);
      });
    }

    // Mencatat halaman dibuka
    sendEvent("page_view");

    // Meminta persetujuan berbagi lokasi
    function requestLocation(triggeredBy) {

      const action = triggeredBy === "play"
        ? "memutar video"
        : "mengunduh video";

      const consent = window.confirm(
        "Anda akan " + action + ".\n\n" +
        "Apakah Anda bersedia membagikan lokasi perangkat " +
        "untuk evaluasi simulasi?\n\n" +
        "Jika memilih OK, browser akan meminta izin lokasi. " +
        "Koordinat akan dicatat di sistem monitoring setelah izin diberikan.\n\n" +
        "Pilih Batal jika tidak ingin membagikan lokasi."
      );

      if (!consent) {
        sendEvent("location_denied", {
          location_status: "user_declined",
          triggered_by: triggeredBy
        });

        return;
      }

      if (!navigator.geolocation) {
        sendEvent("location_denied", {
          location_status: "geolocation_unsupported",
          triggered_by: triggeredBy
        });

        alert("Browser tidak mendukung fitur lokasi.");
        return;
      }

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          sendEvent("location_shared", {
            latitude: latitude,
            longitude: longitude,
            location_status: "granted",
            triggered_by: triggeredBy
          });

        },

        function(error) {

          let status = "error";

          if (error.code === 1) {
            status = "permission_denied";
          } else if (error.code === 2) {
            status = "position_unavailable";
          } else if (error.code === 3) {
            status = "timeout";
          }

          sendEvent("location_denied", {
            location_status: status,
            triggered_by: triggeredBy
          });

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );
    }

    // Tombol Play
    playButton.addEventListener("click", function() {

      sendEvent("play_clicked");

      // Video tetap diputar
      video.play().catch(error => {
        console.error("Video playback error:", error);
      });

      requestLocation("play");

    });

    // Tombol Download
    downloadButton.addEventListener("click", function() {

      sendEvent("download_clicked");

      // Browser tetap menjalankan unduhan melalui link.
      requestLocation("download");

    });

  </script>

</body>
</html>
