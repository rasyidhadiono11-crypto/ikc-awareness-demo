
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IKC Day 1 - Video Preview Simulation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: #f8fafd;
      color: #202124;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      color: #5f6368;
      font-size: 14px;
    }

    .drive-icon {
      width: 28px;
      height: 28px;
      background: #1a73e8;
      color: white;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .file-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .file-icon {
      width: 46px;
      height: 46px;
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .file-name {
      font-size: 17px;
      font-weight: 600;
    }

    .file-type {
      margin-top: 5px;
      color: #5f6368;
      font-size: 13px;
    }

    .preview {
      background: #202124;
      min-height: 350px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .preview video {
      width: 100%;
      max-height: 480px;
      display: none;
      background: #000;
    }

    .play-overlay {
      text-align: center;
      color: white;
      padding: 30px;
    }

    .play-circle {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #1a73e8;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 30px;
      cursor: pointer;
      border: none;
      color: white;
    }

    .play-circle:hover {
      background: #1558b0;
    }

    .preview-caption {
      color: #dadce0;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 24px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: #1a73e8;
      color: white;
    }

    .btn-primary:hover {
      background: #1558b0;
    }

    .btn-secondary {
      background: white;
      color: #1a73e8;
      border: 1px solid #dadce0;
    }

    .btn-secondary:hover {
      background: #f1f3f4;
    }

    .notice {
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #dadce0;
      border-radius: 10px;
      background: white;
      font-size: 13px;
      line-height: 1.6;
      color: #5f6368;
    }

    .notice strong {
      color: #202124;
    }

    .status {
      margin-top: 14px;
      min-height: 20px;
      color: #5f6368;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 14px;
      }

      .preview {
        min-height: 240px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="topbar">
      <div class="drive-icon">▶</div>
      <span>Video Preview</span>
    </div>

    <div class="file-header">
      <div class="file-icon">▶</div>

      <div>
        <div class="file-name">IKC_Day1.mp4</div>
        <div class="file-type">Video MP4</div>
      </div>
    </div>

    <section class="preview">

      <div class="play-overlay" id="playOverlay">

        <button
          type="button"
          class="play-circle"
          id="playButton"
          aria-label="Putar video">
          ▶
        </button>

        <div class="preview-caption">
          Klik untuk memutar video
        </div>

      </div>

      <video id="videoPlayer" controls playsinline>
        <source src="IKC_Day1.mp4" type="video/mp4">
        Browser Anda tidak mendukung pemutaran video.
      </video>

    </section>

    <div class="actions">

      <button
        type="button"
        class="btn btn-primary"
        id="actionPlay">
        ▶ Play
      </button>

      <button
        type="button"
        class="btn btn-secondary"
        id="downloadButton">
        ↓ Download
      </button>

    </div>

    <div class="notice">
      <strong>Informasi IKC Awareness</strong><br>
      Aktivitas akses Play dan Download.
    </div>

    <div class="status" id="statusMessage"></div>

  </main>

  <script>

    // ==========================================
    // 1. KONFIGURASI GOOGLE APPS SCRIPT
    // ==========================================

    const SHEET_URL =
      "https://script.google.com/macros/s/AKfycbwM_-qIyRyQGBVJnFuFSkktIu_BNdUEBqRiLcWIc8mKzOab6AWQ6Vki0kUIBqBRc_l-lA/exec";

    const VIDEO_URL = "IKC_Day1.mp4";

    // ==========================================
    // 2. SESSION ID
    // ==========================================

    function getSessionId() {

      let sessionId = sessionStorage.getItem("ikc_session_id");

      if (!sessionId) {

        sessionId =
          window.crypto &&
          typeof window.crypto.randomUUID === "function"
            ? window.crypto.randomUUID()
            : "IKC-" + Date.now() + "-" +
              Math.random().toString(36).substring(2, 10);

        sessionStorage.setItem("ikc_session_id", sessionId);
      }

      return sessionId;
    }

    // ==========================================
    // 3. DETEKSI DEVICE, OS, BROWSER
    // ==========================================

    function getDeviceInfo() {

      const ua = navigator.userAgent || "";

      let device = /Android|iPhone|iPad|iPod/i.test(ua)
        ? "Mobile"
        : "Desktop";

      let os = "Unknown";

      if (/Android/i.test(ua)) {
        os = "Android";
      } else if (/iPhone|iPad|iPod/i.test(ua)) {
        os = "iOS";
      } else if (/Windows/i.test(ua)) {
        os = "Windows";
      } else if (/Macintosh|Mac OS/i.test(ua)) {
        os = "MacOS";
      } else if (/Linux/i.test(ua)) {
        os = "Linux";
      }

      let browser = "Unknown";

      if (/Edg/i.test(ua)) {
        browser = "Edge";
      } else if (/OPR|Opera/i.test(ua)) {
        browser = "Opera";
      } else if (/Chrome/i.test(ua)) {
        browser = "Chrome";
      } else if (/Firefox/i.test(ua)) {
        browser = "Firefox";
      } else if (/Safari/i.test(ua)) {
        browser = "Safari";
      }

      return {
        device: device,
        os: os,
        browser: browser
      };
    }

    // ==========================================
    // 4. KIRIM DATA KE GOOGLE SHEETS
    // Hanya menggunakan aktivitas yang diizinkan
    // oleh Apps Script:
    // page_view
    // play_clicked
    // download_clicked
    // location_shared
    // location_denied
    // ==========================================

    function sendToSheet(activity, extra = {}) {

      const deviceInfo = getDeviceInfo();

      const payload = {
        session_id: getSessionId(),
        activity: activity,
        device: deviceInfo.device,
        os: deviceInfo.os,
        browser: deviceInfo.browser,
        latitude: extra.latitude ?? "",
        longitude: extra.longitude ?? "",
        location_status: extra.location_status || ""
      };

      const body = JSON.stringify(payload);

      // Metode utama: sendBeacon
      if (navigator.sendBeacon) {

        try {

          const blob = new Blob(
            [body],
            { type: "text/plain;charset=UTF-8" }
          );

          const queued = navigator.sendBeacon(
            SHEET_URL,
            blob
          );

          if (queued) {
            return true;
          }

        } catch (error) {
          console.warn("sendBeacon gagal:", error);
        }
      }

      // Metode cadangan
      fetch(SHEET_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: body,
        keepalive: true
      }).catch(error => {
        console.error("Pengiriman ke Sheet gagal:", error);
      });

      return true;
    }

    // ==========================================
    // 5. CATAT AKTIVITAS
    // ==========================================

    function logActivity(activity) {
      sendToSheet(activity);
    }

    // ==========================================
    // 6. PROSES PERSETUJUAN DAN GPS
    // ==========================================

    function requestLocation() {

      const consent = window.confirm(
        "INFORMASI BERBAGI LOKASI\n\n" +
        "Apakah Anda bersedia membagikan lokasi perangkat " +
        "untuk keperluan evaluasi simulasi IKC Awareness?\n\n" +
        "Pilih OK untuk melanjutkan permintaan izin lokasi " +
        "melalui browser.\n\n" +
        "Pilih Cancel untuk melanjutkan tanpa membagikan lokasi."
      );

      // Pengguna menolak persetujuan
      if (!consent) {

        sendToSheet("location_denied", {
          location_status: "consent_declined"
        });

        document.getElementById("statusMessage").textContent =
          "Lokasi tidak dibagikan. Aktivitas tetap dicatat tanpa koordinat.";

        return;
      }

      // Periksa dukungan GPS
      if (!navigator.geolocation) {

        sendToSheet("location_denied", {
          location_status: "geolocation_not_supported"
        });

        document.getElementById("statusMessage").textContent =
          "Browser tidak mendukung fitur lokasi.";

        return;
      }

      // Pastikan halaman menggunakan HTTPS
      if (!window.isSecureContext) {

        sendToSheet("location_denied", {
          location_status: "insecure_context"
        });

        document.getElementById("statusMessage").textContent =
          "Fitur lokasi memerlukan halaman HTTPS.";

        return;
      }

      document.getElementById("statusMessage").textContent =
        "Silakan berikan izin lokasi pada browser jika diminta.";

      // Meminta izin GPS browser
      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          // Kirim koordinat ke Apps Script
          // Apps Script akan membentuk URL Google Maps
          sendToSheet("location_shared", {
            latitude: latitude,
            longitude: longitude,
            location_status: "granted"
          });

          document.getElementById("statusMessage").textContent =
            "Lokasi berhasil diperoleh. Data lokasi dikirim untuk dicatat.";

        },

        function(error) {

          let locationStatus = "location_error";

          if (error.code === error.PERMISSION_DENIED) {
            locationStatus = "permission_denied";
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            locationStatus = "position_unavailable";
          } else if (error.code === error.TIMEOUT) {
            locationStatus = "timeout";
          }

          sendToSheet("location_denied", {
            location_status: locationStatus
          });

          document.getElementById("statusMessage").textContent =
            "Lokasi tidak berhasil diperoleh. Aktivitas tetap dicatat tanpa koordinat.";

        },

        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }

      );
    }

    // ==========================================
    // 7. TOMBOL PLAY
    // ==========================================

    function handlePlay() {

      // Catat klik Play
      logActivity("play_clicked");

      // Minta persetujuan lokasi
      requestLocation();

      // Jalankan video
      const video = document.getElementById("videoPlayer");
      const overlay = document.getElementById("playOverlay");

      overlay.style.display = "none";
      video.style.display = "block";

      video.play().catch(error => {
        console.warn("Video gagal diputar:", error);
      });
    }

    document
      .getElementById("playButton")
      .addEventListener("click", handlePlay);

    document
      .getElementById("actionPlay")
      .addEventListener("click", handlePlay);

    // ==========================================
    // 8. TOMBOL DOWNLOAD
    // ==========================================

    document
      .getElementById("downloadButton")
      .addEventListener("click", function() {

        // Catat klik Download
        logActivity("download_clicked");

        // Minta persetujuan lokasi
        requestLocation();

        // Jalankan download
        const link = document.createElement("a");

        link.href = VIDEO_URL;
        link.download = "IKC_Day1.mp4";

        document.body.appendChild(link);
        link.click();
        link.remove();

      });

    // ==========================================
    // 9. PAGE VIEW
    // ==========================================

    window.addEventListener("load", function() {

      sendToSheet("page_view", {
        location_status: ""
      });

    });

  </script>

</body>
</html>
